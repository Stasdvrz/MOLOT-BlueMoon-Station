author: Herobrine998
delete-after: true
changes:
  - bugfix: Исправлен баг, позволявший мобам атаковать мехов без задержки
  - balance: У мехов убран множитель урона от атак сзади
  - qol: Отметки крю-монитора сохраняются после закрытия окна отдельно для каждого
      устройства
  - qol: В крю-монитор добавлены иконки профессий в списке и на карте. Настройки имён,
      иконок и отделов сохраняются отдельно для каждого монитора
  - qol: На карте крю-монитора добавлены пульсация и точки повреждений, а для погибших
      - непрозрачная ЧБ-иконка с черепом
  - qol: Категория имплантов на сканере удалена, оставлена короткая строчка с имплантами
  - bugfix: 'Исправлена сортировка крю-монитора: погибшие отображаются выше раненых,
      но ниже отмеченных'
  - balance: В агрессивном интенте снаряды попадают по лежащим и персонажам в крите,
      кроме мёртвых и притворяющихся мёртвыми; в граб-интенте критованных добивать
      не будет
  - bugfix: 'Исправлена работа медицинского сканера для слепых: сканировать можно,
      читать результаты нельзя; внутренние сканеры и наниты продолжают работать'
  - refactor: 'Удалена категория Bluespace Designs: разработки распределены по назначению
      и core-файлам, модульные переопределения объединены, опустевшие файлы удалены'
  - rscadd: Всем отделам добавлена печать подходящих версий ГПС, выключенных по умолчанию
