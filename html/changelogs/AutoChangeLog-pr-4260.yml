changes:
  - rscadd: Новые стили чата, анимации появления сообщений и фоны.
  - rscadd: 'Вкладка "Каналы": своё оформление для каждого типа сообщений.'
  - rscadd: Предпросмотр оформления и код оформления чата для обмена.
  - rscadd: Состояние персонажа видно в тексте речи (опьянение, озноб, удушье, кляп,
      помехи рации), каждый эффект выключается в настройках.
  - tweak: Тег должности в рации красится по отделу, главы помечены, перед тегом значок
      профессии; старая раскраска доступна в настройках.
  - tweak: В списке экипажа главы отделов помечены.
  - bugfix: Речь галлюцинаций больше не отличается от настоящей по виду.
  - bugfix: Русские слова фобий и гипноза подсвечиваются.
  - code_imp: Фоны чата анимируются без перерисовки.
